<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>RegionShare – Border</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #frame { position: fixed; inset: 0; box-sizing: border-box; border: 3px solid #ff3b30; }
</style>
</head>
<body>
<div id="frame"></div>
<script>
  const px = new URLSearchParams(location.search).get('px') || '3';
  document.getElementById('frame').style.borderWidth = px + 'px';
</script>
</body>
</html>
